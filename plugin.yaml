name: hermes-anilist
version: 0.9.0
description: "AniList tracker for Hermes Desktop — airing countdowns, season browsing and episode alerts in a status-bar popover, plus agent tools for reading your own list."
author: BatataBF
license: MIT
homepage: https://github.com/BatataBF/hermes-anilist
kind: standalone
requires_hermes: ">=0.21"
# NOTE: no `manifest_version: 2` here even though the loader accepts it.
# `hermes plugins install` pins its own ceiling at 1 (hermes_cli/plugins_cmd.py
# `_SUPPORTED_MANIFEST_VERSION`), so a v2 declaration makes the plugin
# UNINSTALLABLE from git while still loadable and catalog-valid — the two
# constants drifted (loader: plugins_manifest.SUPPORTED_MANIFEST_VERSION = 2).
# Every v2 field below is parsed with no version gate
# (plugins_manifest._parse_manifest_v2_fields), so staying on v1 keeps the whole
# feature set and the installer works.
tags:
  - desktop
  - anime
  - anilist
  - tracker
# The agent's tools, by NAME — the loader derives the toolset from these.
# Registration lives in tools.py (called from register(ctx) in __init__.py), and
# `hermes plugins validate` fails when this list and that registration disagree,
# so the two move together or not at all.
provides_tools:
  - anilist_list
  - anilist_show
python_dependencies:
  # Resolved together with Hermes' own ranges and installed into the venv by
  # `hermes plugins install` / `enable`; re-applied after `hermes update`.
  - "httpx>=0.28.1,<1"
# No `config_schema` on purpose: this plugin has no user-visible server-side
# settings. Preferences (feed window, title language, covers, alert destination
# and channel) are client-side, in the desktop half's own storage; the AniList
# client id lives in the plugin's profile-scoped state — every account
# registers its own app — and the token in the profile's `.env`.
