name: CI

# What a contributor (and the catalog reviewer) can reproduce locally:
#   hermes plugins validate .        ← the same validator this workflow runs
#   uvx ruff check .                 ← the lint step below
#   uv run --with pytest --with httpx --with fastapi --quiet pytest tests/ -q
#   node tools/test_plugin_helpers.mjs && node tools/test_plugin_gate.mjs
#   node tools/i18n_audit.mjs desktop/plugin.js
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The catalog's admission gate: the manifest schema, and declared-vs-actually
  # -registered capabilities. `hermes plugins validate` loads the plugin in a
  # scratch subprocess, so a tool declared in plugin.yaml but never registered
  # (or registered but never declared) fails here instead of in the catalog PR.
  #
  # It does NOT use NousResearch/hermes-agent/.github/actions/plugin-validate:
  # that action installs Hermes with `pip install git+…`, and Hermes' setup.py
  # refuses to build a wheel outside a Nix build ("Hermes is distributed via the
  # shell installer, Docker image, or Nix"), so the action cannot succeed against
  # any current ref — verified against main, where it died with "Failed building
  # wheel for hermes-agent". An editable install from a checkout is the path
  # Hermes documents for development, and it is what the steps below do.
  validate:
    name: hermes plugins validate
    runs-on: ubuntu-latest
    env:
      # Which Hermes to validate against. `main` keeps `requires_hermes: ">=0.21"`
      # honest; pin a tag here if upstream ever breaks mid-cycle.
      HERMES_REF: main
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --quiet uv

      - name: Check out Hermes (${{ env.HERMES_REF }})
        run: |
          git clone --quiet --filter=blob:none --depth 1 \
            --branch "$HERMES_REF" \
            https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"

      # Editable, because a wheel build is refused by design. `--no-dev` skips
      # the test-only dependencies this job never runs.
      - name: Install Hermes
        working-directory: ${{ runner.temp }}/hermes-agent
        run: uv sync --no-dev

      - name: Validate
        run: |
          HERMES="$RUNNER_TEMP/hermes-agent/.venv/bin/hermes"
          "$HERMES" plugins validate "$GITHUB_WORKSPACE"
          "$HERMES" plugins doctor "$GITHUB_WORKSPACE" --ci

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin runs inside Hermes' venv; the second row exists so the
        # source stays installable on the next Python too.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: python -m pip install --quiet --upgrade pip pytest httpx fastapi ruff==0.16.8

      # Bug-focused lint (see ruff.toml): undefined names, unused imports, blind
      # excepts that carry no reason. Not a style police.
      - name: Ruff
        run: ruff check .

      # The backend half: offline, no network, payloads trimmed from real
      # AniList responses.
      - name: pytest
        run: pytest tests/ -q

      # The desktop half's pure helpers, the surface gate, and i18n parity
      # (Node is on the runner).
      - name: Desktop half — helpers, gate and locale parity
        run: |
          node tools/test_plugin_helpers.mjs
          node tools/test_plugin_gate.mjs
          node tools/i18n_audit.mjs desktop/plugin.js
